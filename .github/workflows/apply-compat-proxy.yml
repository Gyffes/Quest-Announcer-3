name: Apply QA3 QuestLog Compatibility Proxy

on:
  push:
    branches:
      - agent/taint-isolation-12-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taint-isolation-12-1
          fetch-depth: 0

      - name: Replace snapshot with read-only native API fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('QuestAnnounce.lua')
          text = p.read_text(encoding='utf-8')
          old = '''local NativeQuestLog = C_QuestLog
          local QA_QuestLog = {}
          if NativeQuestLog then
              for key, value in pairs(NativeQuestLog) do
                  QA_QuestLog[key] = value
              end
          end'''
          new = '''local NativeQuestLog = C_QuestLog
          local QA_QuestLog = {}
          if NativeQuestLog then
              setmetatable(QA_QuestLog, { __index = NativeQuestLog })
          end'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected compatibility snapshot exactly once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate isolation guard
        run: python3 tests/test_taint_isolation.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuestAnnounce.lua
          git commit -m "Use read-only native QuestLog compatibility fallback"
          git push origin HEAD:agent/taint-isolation-12-1
