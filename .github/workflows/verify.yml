name: Verify addon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only Lua runtime
        run: python -m pip install -r tests/requirements.txt
      - name: Verify and package release candidate
        shell: pwsh
        run: ./build_release_candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: questannounce-rc
          path: |
            dist/*.zip
            dist/*.sha256
